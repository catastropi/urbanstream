<text x="746.5" y="528" text-anchor="middle" font-size="12.5" fill="#3E4C59">gitleaks, 액션 SHA 고정</text>
<rect x="906" y="462" width="267" height="82" rx="8" fill="#F1F3F5" stroke="#7A838C" stroke-width="1.5"/>
