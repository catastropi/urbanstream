<text x="160.5" y="511" text-anchor="middle" font-size="12.5" fill="#3E4C59">소스·계층 상태, 수집 공백 감시</text>
<text x="160.5" y="528" text-anchor="middle" font-size="12.5" fill="#3E4C59">Discord 알림 (Airflow와 별도)</text>
