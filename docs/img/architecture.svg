<text x="1039.5" y="528" text-anchor="middle" font-size="12.5" fill="#3E4C59">8개 리소스 생성·삭제·재생성</text>
<text x="27" y="580" font-size="12" fill="#52606D">한계: 수집 대상은 도로 링크 4개 · 버스 노선 1개 · 기상 격자 1개. API의 "현재" 값은 Gold 적재 주기 때문에 최대 약 80분 늦음(응답의 meta.as_of / stale로 표시).</text>
<text x="27" y="600" font-size="12" fill="#52606D">Bronze에서 Silver를 다시 만드는 재처리 경로와 Kafka 다중 브로커 구성은 아직 없음 (docs/DEFERRED.md 참고).</text>
