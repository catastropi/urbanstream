<rect width="1200" height="640" fill="#FFFFFF"/>
<text x="27" y="38" font-size="20" font-weight="700" fill="#1F2933">UrbanStream 데이터 흐름</text>
<text x="27" y="60" font-size="12.5" fill="#52606D">수집·스트리밍·배치는 Mac(Docker Compose)에서 실행. Azure에는 점선 안의 서빙 계층만 스냅샷으로 올렸다가 삭제함.</text>
