# UrbanStream docker-compose.yml  (Step 2: 인프라 3종)
#
# 지금 들어 있는 것: postgres(PostGIS), kafka(KRaft 단일 노드), kafka-ui(개발용), spark-bronze(Step 4)
# 아직 없는 것(만드는 단계에서 추가): minio(선택).
#   (collector 는 호스트에서 직접 실행한다 — ADR-0004.) 이미지가 없는 서비스를 미리 적어 두지 않는다.
#
# profiles
#   core      : postgres, kafka       (.env 의 COMPOSE_PROFILES=core 이면 `docker compose up -d` 로 기동)
#   dev       : kafka-ui              (COMPOSE_PROFILES=core,dev)
#   streaming : spark-bronze          (COMPOSE_PROFILES=core,streaming — scripts/stack.sh up-streaming)
#   airflow   : airflow-scheduler/apiserver/dag-processor  (Step 7 — scripts/stack.sh up-airflow)
#   monitor   : monitor (Step 8 — 감사 토픽 감시 + 알림. scripts/stack.sh up-monitor)
#   api       : api (Step 9 — FastAPI 읽기 전용 서빙. scripts/stack.sh up-api, http://127.0.0.1:8010/docs)
#
# 사용법은 docs/runbooks/step2-stack.md, 결정 근거는 docs/adr/0003-compose-infra.md.
# 모든 포트는 127.0.0.1 에만 연다 (같은 와이파이의 다른 기기에서 접근 불가).
# 값은 .env 에서 읽는다. 비밀번호는 이 파일에 쓰지 않는다. `scripts/stack.sh init-env` 가 .env 에 없는 항목을 채운다.

name: urbanstream

# 횟수 제한을 두지 않는다(D-142): Mac 훈련에서 Kafka 를 내렸다 올리자 spark-bronze 가 '브로커 이름을 못 찾음'으로 즉시 죽고, 3번 재시작이
# 몇 초 안에 모두 실패해 그대로 멈췄다(약 8시간 적재 중단). 계속 재시도하면 Kafka 가 돌아온 뒤 저절로 회복한다. 코드 오류로 반복해 죽는 경우는 감시(monitor)가 알린다.
x-restart: &restart
  restart: on-failure

# Step 7: Airflow 공통 설정. 결정 근거 docs/adr/0009-step7-airflow.md, 사용법 docs/runbooks/step7a-airflow.md
# - env_file 을 쓰지 않는다: .env 전체(API 키 등)가 컨테이너에 들어가지 않게, 필요한 값만 아래에 적는다.
# - 메타데이터 DB 는 같은 Postgres 안의 별도 DB(airflow). 업무 DB 접속은 최소 권한 역할(gold_loader)만 쓴다.
# - docker.sock 을 마운트하지 않는다. Spark(gold_stage)는 이 컨테이너 안에서 서브프로세스로 돈다 (batch/jobs.py).
x-airflow-common: &airflow-common
  <<: *restart
  image: urbanstream/airflow:${AIRFLOW_VERSION:-3.3.0}
  profiles: ["airflow"]
  user: "50000:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY 가 .env 에 없습니다. scripts/stack.sh init-env 를 먼저 실행하세요}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET 가 .env 에 없습니다. scripts/stack.sh init-env 를 먼저 실행하세요}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD 가 .env 에 없습니다}@postgres:5432/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # DAG 가 쓰는 값 (batch/db.py, batch/jobs.py). 업무 DB 관리자 비밀번호는 넣지 않는다.
    URBANSTREAM_ROOT: /opt/urbanstream
    PYTHONPATH: /opt/urbanstream:/opt/urbanstream/src
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-urbanstream}
    GOLD_WRITER_USER: gold_loader
    GOLD_WRITER_PASSWORD: ${GOLD_LOADER_PASSWORD:?GOLD_LOADER_PASSWORD 가 .env 에 없습니다. scripts/stack.sh init-env 를 먼저 실행하세요}
    GOLD_SILVER_ROOT: /data/silver
    GOLD_BRONZE_ROOT: /data/bronze
    GOLD_STAGE_ROOT: /data/gold_stage
    # 알림 (Step 8, ADR-0010). 웹훅 URL 은 비밀이다 — .env 에만 두고 여기에는 이름만 적는다. 비어 있으면 알림은 ops.alert_event 에만 기록된다.
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ALERT_WEBHOOK_KIND: ${ALERT_WEBHOOK_KIND:-discord}
    ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
  volumes: &airflow-volumes
    - ./dags:/opt/airflow/dags:ro
    - ./batch:/opt/urbanstream/batch:ro
    - ./src:/opt/urbanstream/src:ro
    - ./streaming:/opt/urbanstream/streaming:ro
    - ./config:/opt/urbanstream/config:ro
    - ./data/bronze:/data/bronze:ro
    - ./data/silver:/data/silver:ro
    - ./data/gold_stage:/data/gold_stage
    - ./data/airflow/logs:/opt/airflow/logs

services:
  postgres:
    <<: *restart
    image: ${POSTGRES_IMAGE:-imresamu/postgis:17-3.6.1-bookworm}
    profiles: ["core"]
    container_name: urbanstream-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbanstream}
      POSTGRES_DB: ${POSTGRES_DB:-urbanstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 없습니다. scripts/stack.sh init-env 를 먼저 실행하세요}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}

  kafka:
    <<: *restart
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.2}
    profiles: ["core"]
    container_name: urbanstream-kafka
    # 리스너 2개: 컨테이너끼리는 kafka:19092(INTERNAL), 내 Mac 에서는 localhost:9092(EXTERNAL)
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID 가 .env 에 없습니다. scripts/stack.sh init-env 를 먼저 실행하세요}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 단일 브로커: 내부 토픽 복제 수는 1이어야 기동한다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽 이름 오타가 조용히 새 토픽을 만드는 일을 막는다. 토픽은 Step 3 에서 명시적으로 만든다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
      # 로그(토픽 데이터) 위치. 지정하지 않으면 이미지 기본값 /tmp/kafka-logs 에 써서 아래 볼륨 밖(컨테이너 안)에 쌓이고,
      # `down`/재생성 때 토픽과 메시지가 사라진다 (2026-11-03 발견: kafka-data 볼륨 0B, 컨테이너 쓰기 공간 1.35GB).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 40s
    mem_limit: ${KAFKA_MEM_LIMIT:-1g}

  kafka-ui:
    <<: *restart
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:latest}
    profiles: ["dev"]
    container_name: urbanstream-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: urbanstream-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xmx384m
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8090}:8080"
    mem_limit: ${KAFKA_UI_MEM_LIMIT:-768m}

  # Step 4: Kafka 토픽 7개 → data/bronze (Parquet). 결정 근거: docs/adr/0005-bronze-spark.md, 사용법: docs/runbooks/step4-bronze.md
  spark-bronze:
    <<: *restart
    profiles: ["streaming"]
    build:
      context: .
      dockerfile: docker/spark-base/Dockerfile
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-apache/spark:4.1.3-scala2.13-java17-python3-ubuntu}
        SPARK_VERSION: ${SPARK_VERSION:-4.1.3}
    image: urbanstream/spark-bronze:${SPARK_VERSION:-4.1.3}
    container_name: urbanstream-spark-bronze
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BRONZE_KAFKA_BOOTSTRAP: kafka:19092
      BRONZE_TRIGGER_SEC: ${BRONZE_TRIGGER_SEC:-60}
      BRONZE_MAX_OFFSETS_PER_TRIGGER: ${BRONZE_MAX_OFFSETS_PER_TRIGGER:-50000}
      BRONZE_STARTING_OFFSETS: ${BRONZE_STARTING_OFFSETS:-earliest}
    # local[2]: 한 JVM 안에서 토픽별 쿼리 7개를 같이 돌린다 (클러스터 master/worker 를 따로 띄우지 않는다 — 메모리 때문, ADR-0005 결정 3)
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g", "/app/streaming/bronze_writer.py"]
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"
    volumes:
      - ./data/bronze:/data/bronze
      - ./data/checkpoints:/data/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4040/api/v1/applications', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: ${SPARK_BRONZE_MEM_LIMIT:-1536m}

  # Step 5: data/bronze (Parquet) → data/silver. Bronze 와 같은 이미지(코드 포함)를 쓰므로 빌드는 spark-bronze 에서만 한다.
  # 결정 근거: docs/adr/0006-step5-pre-decisions.md (5: 별도 컨테이너), docs/adr/0007-silver-rules.md. 사용법: docs/runbooks/step5-silver.md
  # Bronze 폴더는 읽기 전용으로 마운트한다 (Silver 가 Bronze 를 건드리지 못하게 — 폴더 규칙, DEFERRED D-21).
  spark-silver:
    <<: *restart
    profiles: ["silver"]
    image: urbanstream/spark-bronze:${SPARK_VERSION:-4.1.3}
    container_name: urbanstream-spark-silver
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g", "/app/streaming/silver_writer.py"]
    ports:
      - "127.0.0.1:${SILVER_UI_PORT:-4041}:4040"
    volumes:
      - ./data/bronze:/data/bronze:ro
      - ./data/silver:/data/silver
      - ./data/checkpoints:/data/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4040/api/v1/applications', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: ${SPARK_SILVER_MEM_LIMIT:-1536m}

  # Step 6: Gold 스테이징 (일회성 배치 — `docker compose up` 으로 뜨지 않는다. scripts/gold_run.sh 가 `run --rm` 으로 실행).
  # DB 비밀번호를 주지 않는다: Spark 는 Parquet 만 만들고, DB 적재는 호스트 Python(batch/gold_load.py)이 한다 (ADR-0008 ⑤).
  # Silver·Bronze 는 읽기 전용 마운트 (폴더 규칙, DEFERRED D-21).
  spark-gold:
    <<: *restart
    profiles: ["gold"]
    image: urbanstream/spark-bronze:${SPARK_VERSION:-4.1.3}
    container_name: urbanstream-spark-gold
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g", "/app/batch/gold_stage.py"]
    volumes:
      - ./data/bronze:/data/bronze:ro
      - ./data/silver:/data/silver:ro
      - ./data/gold_stage:/data/gold_stage
    mem_limit: ${SPARK_GOLD_MEM_LIMIT:-1536m}

  # Step 7: Airflow. 스케줄러가 먼저 DB 마이그레이션·관리자 계정·풀을 준비하고(healthy), 나머지 둘은 그 뒤에 켜진다.
  # (Compose v2.10 에서 service_completed_successfully 가 불안정해 init 컨테이너를 쓰지 않는다.)
  # 스케줄러 컨테이너가 LocalExecutor 로 태스크를 돌리고, gold_stage 의 Spark JVM(힙 1g)도 여기서 뜬다 → 한도를 넉넉히.
  airflow-scheduler:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.0-python3.12}
        AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.0}
        PYSPARK_VERSION: ${PYSPARK_VERSION:-4.1.3}
    container_name: urbanstream-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD 가 .env 에 없습니다. scripts/stack.sh init-env 를 먼저 실행하세요}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin --username "$$AIRFLOW_ADMIN_USER" --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname admin --lastname admin --email admin@example.com || echo "관리자 계정이 이미 있습니다"
        airflow pools set gold_io 1 "gold stage+load: 한 번에 하나"
        exec /entrypoint scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: ${AIRFLOW_SCHEDULER_MEM_LIMIT:-3g}

  airflow-apiserver:
    <<: *airflow-common
    container_name: urbanstream-airflow-apiserver
    depends_on:
      airflow-scheduler:
        condition: service_healthy
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${AIRFLOW_APISERVER_MEM_LIMIT:-1g}

  airflow-dag-processor:
    <<: *airflow-common
    container_name: urbanstream-airflow-dag-processor
    depends_on:
      airflow-scheduler:
        condition: service_healthy
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${AIRFLOW_DAGPROC_MEM_LIMIT:-768m}

  # Step 8: 감시 루프. Airflow 이미지(psycopg·confluent-kafka·pyyaml 포함)를 그대로 쓰고 아무것도 새로 빌드하지 않는다. 결정 근거 docs/adr/0010-step8-dq-monitoring.md
  # - env_file·docker.sock 을 쓰지 않는다. 필요한 값만 아래에 적는다 (API 키·업무 DB 관리자 비밀번호는 들어가지 않는다).
  # - 코드·설정·Bronze/Silver 는 모두 읽기 전용 마운트. 쓰는 곳은 Postgres 의 ops 표뿐이다.
  # - 이미지는 airflow-scheduler 의 build 로 만든다 → scripts/stack.sh up-monitor 가 먼저 빌드한다 (Compose v2.10).
  monitor:
    <<: *restart
    image: urbanstream/airflow:${AIRFLOW_VERSION:-3.3.0}
    profiles: ["monitor"]
    container_name: urbanstream-monitor
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    entrypoint: ["python", "-m", "urbanstream.monitor"]
    environment:
      URBANSTREAM_ROOT: /opt/urbanstream
      PYTHONPATH: /opt/urbanstream:/opt/urbanstream/src
      TZ: Asia/Seoul
      KAFKA_BOOTSTRAP: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-urbanstream}
      GOLD_WRITER_USER: gold_loader
      GOLD_WRITER_PASSWORD: ${GOLD_LOADER_PASSWORD:?GOLD_LOADER_PASSWORD 가 .env 에 없습니다. scripts/stack.sh init-env 를 먼저 실행하세요}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_KIND: ${ALERT_WEBHOOK_KIND:-discord}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
    volumes:
      - ./batch:/opt/urbanstream/batch:ro
      - ./src:/opt/urbanstream/src:ro
      - ./config:/opt/urbanstream/config:ro
      - ./data/bronze:/data/bronze:ro
      - ./data/silver:/data/silver:ro
    healthcheck:
      # 박동 파일이 5분 안에 갱신돼야 정상 (주기 60초). 루프가 멈추면 unhealthy 로 보인다.
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/monitor.alive') < 300 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: ${MONITOR_MEM_LIMIT:-256m}

  # Step 9: 읽기 전용 API. 결정 근거 docs/adr/0011-step9-api.md, 사용법 docs/runbooks/step9-api.md
  # - DB 는 api_service 역할(013, SELECT 전용 + 5초 제한)로만 붙는다. 업무 DB 관리자·gold_loader 비밀번호는 넣지 않는다.
  # - ${...:-} 를 쓰는 이유: `:?` 로 필수 처리하면 stack.sh 의 ps/down/stats(--profile '*')가 API 키 없이는 전부 실패한다.
  #   대신 앱이 키·비밀번호가 비어 있으면 기동을 거부한다(fail-closed) — scripts/stack.sh up-api 가 미리 안내한다.
  # - 읽기 전용 파일시스템, 모든 capability 제거. 포트는 127.0.0.1 에만 연다.
  api:
    <<: *restart
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: urbanstream/api:${API_IMAGE_TAG:-1.0.0}
    profiles: ["api"]
    container_name: urbanstream-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      API_KEYS: ${API_KEYS:-}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
      API_DB_HOST: postgres
      API_DB_PORT: "5432"
      API_DB_NAME: ${POSTGRES_DB:-urbanstream}
      API_DB_USER: api_service
      API_RATE_LIMIT_PER_MIN: ${API_RATE_LIMIT_PER_MIN:-120}
      API_RATE_BURST: ${API_RATE_BURST:-40}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      API_STALE_AFTER_SEC: ${API_STALE_AFTER_SEC:-10800}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /health 는 DB 를 보지 않는다(프로세스 생존). DB 는 /ready 로 따로 본다.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${API_MEM_LIMIT:-256m}

volumes:
  postgres-data:
  kafka-data:

networks:
  default:
    name: urbanstream_net
