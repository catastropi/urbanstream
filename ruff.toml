# CI 린트 규칙 (ADR-0013 D11-4, STEP 5 에서 확대: ADR-0018).
# 치명 오류: 문법 오류(E9), 잘못된 비교(F63), 문장 오류(F7), 정의되지 않은 이름(F82).
# STEP 5 추가: 안 쓰는 import(F401), 안 쓰는 지역 변수(F841), 자리표시자 없는 f-string(F541). 켤 때 저장소 전체 44건을 고쳤다.
# F811(재정의)은 켜지 않는다. 테스트가 `from pg_support import pg` 로 fixture 를 가져오고 같은 이름을 인자로 받는 방식이라 119건이 모두 이 패턴이다.
# 포매터는 도입하지 않는다(전 파일 재포맷 diff 가 커서 되돌리기 어렵다).
# 대상 버전 3.11: Mac 의 conda 환경과 주간 CI 행렬의 가장 낮은 버전. 3.12 에서만 되는 문법(f-string 안 같은 따옴표 등)을 여기서 잡는다.
target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841", "F541"]
