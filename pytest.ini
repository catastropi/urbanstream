[pytest]
# src 레이아웃: pip install -e . 없이도 `from urbanstream...` 가 되도록 한다.
pythonpath = src . tests/support
testpaths = tests
# -p layers_plugin: tests/support/layers_plugin.py (Step 11, ADR-0013 D11-5) — 디렉터리 이름을 마커로 붙일 뿐 시험 결과는 바꾸지 않는다.
addopts = -ra -p layers_plugin
markers =
    pg: PostgreSQL(PostGIS)이 필요한 통합 테스트. GOLD_TEST_DSN 이 없으면 건너뛴다.
    unit: 순수 단위 시험 (tests/unit)
    contract: 소스 계약·스키마·OpenAPI 스냅샷 (tests/contract)
    integration: Postgres 가 필요한 통합 시험 (tests/integration)
    spark: Spark/Java 가 필요한 시험 (tests/spark — 운영과 같은 이미지 또는 CI weekly)
    e2e: 실제 API 서버 + 실제 Postgres + 대시보드 클라이언트 (tests/e2e)
    recovery: 복구 스크립트 시험 (tests/recovery)
    api: FastAPI 시험 (tests/api)
    dashboard: 대시보드 시험 (tests/dashboard)
    data: 데이터 품질·마트 값 시험 (기존 시험의 재분류 — tests/support/layers_plugin.py 의 DATA_FILES)
