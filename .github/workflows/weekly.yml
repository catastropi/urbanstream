# 주간 점검 (Step 11, ADR-0013 D11-1): PR 마다 돌리기엔 무겁거나 드물게만 바뀌는 것들. 수동 실행(Run workflow)도 된다.
# 일요일 03:17 KST (= 토요일 18:17 UTC). 정각을 피한 것은 GitHub 의 정각 몰림을 피하려는 것.
name: weekly

on:
  schedule:
    - cron: "17 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  secrets-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: gitleaks — 전체 이력
        run: python3 scripts/ci_gitleaks.py scan --mode full

  python-matrix:
    # PR CI 는 3.12(컨테이너와 같은 버전) 하나. 사용자 Mac 환경(3.11)과 더 새 버전(3.13)은 여기서 본다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: imresamu/postgis:17-3.6.1-bookworm
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: ut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOLD_TEST_DSN: host=127.0.0.1 port=5432 dbname=ut_test user=postgres password=ci-not-a-secret
      ALLOW_ROLE_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -r requirements-dashboard.txt
      - run: python -m pytest -q -m "not spark"

  spark:
    # 운영 이미지(Java 17)와 같은 Java 17 + pyspark 4.1.3. Kafka 커넥터 jar 는 이미지에만 있어 그 확인 시험은 건너뛴다(scripts/spark_test.sh 가 이미지 안에서 확인).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: imresamu/postgis:17-3.6.1-bookworm
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: ut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOLD_TEST_DSN: host=127.0.0.1 port=5432 dbname=ut_test user=postgres password=ci-not-a-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt pyspark==4.1.3 pyproj
      - run: python -m pytest -q -m spark tests/unit/test_bronze_verify.py

  mutation-api-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: imresamu/postgis:17-3.6.1-bookworm
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: ut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOLD_TEST_DSN: host=127.0.0.1 port=5432 dbname=ut_test user=postgres password=ci-not-a-secret
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/mutation_api.py

  dags:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install "apache-airflow==3.3.0" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.12.txt" -r requirements-dev.txt
      - run: python -m pytest -q tests/unit/test_dags_parse.py
